name: Build BitzyLabs upstream candidate

on:
  push:
    branches: [ bitzylabs-cyd-integration ]
    paths:
      - '.github/workflows/sync-bitzylabs-cyd-rc.yml'
      - '.bitzylabs-overlay/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bitzylabs-upstream-candidate
  cancel-in-progress: true

env:
  BITZY_VERSION: v0.1.0-rc1
  BITZY_FIRMWARE_REPO: BitzyLabs/nerdminer-cyd
  BITZY_FIRMWARE_REF: bitzylabs-cyd-phase1
  BITRONICS_UPSTREAM: https://github.com/BitMaker-hub/bitronics-web-flasher.git
  CANDIDATE_BRANCH: bitzylabs-upstream-candidate

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BitzyLabs overlay source
        uses: actions/checkout@v4
        with:
          ref: bitzylabs-cyd-integration
          fetch-depth: 0

      - name: Preserve overlay and rebuild candidate from current Bitronics upstream
        shell: bash
        run: |
          set -euo pipefail

          OVERLAY_TMP="$RUNNER_TEMP/bitzylabs-overlay"
          rm -rf "$OVERLAY_TMP"
          mkdir -p "$OVERLAY_TMP"
          cp -a .bitzylabs-overlay/. "$OVERLAY_TMP/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git remote get-url bitronics >/dev/null 2>&1; then
            git remote set-url bitronics "$BITRONICS_UPSTREAM"
          else
            git remote add bitronics "$BITRONICS_UPSTREAM"
          fi
          git fetch --no-tags bitronics main

          # The candidate is disposable/generated. Starting from upstream/main
          # instead of merging a long-lived customised branch eliminates the
          # exact overwrite/conflict problem this workflow is designed to solve.
          git checkout -B "$CANDIDATE_BRANCH" bitronics/main

          rm -rf .bitzylabs-overlay
          mkdir -p .bitzylabs-overlay
          cp -a "$OVERLAY_TMP"/. .bitzylabs-overlay/

          printf '%s\n' "$(git rev-parse bitronics/main)" > .bitzylabs-overlay/upstream-base.txt

      - name: Check out BitzyLabs CYD firmware source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BITZY_FIRMWARE_REPO }}
          ref: ${{ env.BITZY_FIRMWARE_REF }}
          path: _bitzy_firmware_src
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install --upgrade platformio pillow

      - name: Build corrected BitzyLabs CYD images
        working-directory: _bitzy_firmware_src
        run: pio run -c platformio-bitzylabs.ini -e BitzyLabs-CYD

      - name: Stage BitzyLabs firmware and manifests
        shell: bash
        run: |
          set -euo pipefail

          FACTORY="$(find _bitzy_firmware_src/firmware -type f -name 'BitzyLabs-CYD_factory.bin' -print -quit)"
          UPDATE="$(find _bitzy_firmware_src/firmware -type f -name 'BitzyLabs-CYD_firmware.bin' -print -quit)"
          test -n "$FACTORY" && test -f "$FACTORY"
          test -n "$UPDATE" && test -f "$UPDATE"

          DEST="public/firmware/bitzylabs-cyd/${BITZY_VERSION}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$FACTORY" "$DEST/BitzyLabs-CYD_factory.bin"
          cp "$UPDATE" "$DEST/BitzyLabs-CYD_firmware.bin"

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          version = os.environ['BITZY_VERSION']
          source_ref = os.environ['BITZY_FIRMWARE_REF']
          dest = Path('public/firmware/bitzylabs-cyd') / version
          factory = dest / 'BitzyLabs-CYD_factory.bin'
          update = dest / 'BitzyLabs-CYD_firmware.bin'
          source_sha = subprocess.check_output(
              ['git', '-C', '_bitzy_firmware_src', 'rev-parse', 'HEAD'], text=True
          ).strip()

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          factory_sha = sha256(factory)
          update_sha = sha256(update)

          manifest = {
              'version': version,
              'boards': ['BitzyLabs-CYD'],
              # Current Bitronics UI reads this board->factory hash map.
              'sha256': {'BitzyLabs-CYD': factory_sha},
              'source': 'BitzyLabs/nerdminer-cyd',
              'sourceRef': source_ref,
              'sourceCommit': source_sha,
              'channel': 'release-candidate',
              'files': {
                  'factory': {
                      'name': factory.name,
                      'sha256': factory_sha,
                      'size': factory.stat().st_size,
                  },
                  'update': {
                      'name': update.name,
                      'sha256': update_sha,
                      'size': update.stat().st_size,
                  },
              },
          }
          (dest / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')

          root = Path('public/firmware/bitzylabs-cyd')
          (root / 'manifest.json').write_text(json.dumps({
              'name': 'BitzyLabs CYD',
              'repository': 'BitzyLabs/nerdminer-cyd',
              'versions': [version],
              'boards': ['BitzyLabs-CYD'],
              'channel': 'release-candidate',
          }, indent=2) + '\n')

          print('Factory SHA256:', factory_sha)
          print('Update SHA256: ', update_sha)
          PY

      - name: Restore approved BitzyLabs device and board artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/pictures/boards
          base64 --decode .bitzylabs-overlay/assets/bitzylabs-cyd-selector.webp.b64 > public/pictures/bitzylabs-cyd.webp

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('public/pictures/bitzylabs-cyd.webp')
          dst = Path('public/pictures/boards/ESP32-2432S028R (2.8in CYD).png')
          with Image.open(src) as image:
              image.convert('RGB').save(dst, 'PNG', optimize=True)
          print(f'Created board art: {dst} ({dst.stat().st_size} bytes)')
          PY

          test -s public/pictures/bitzylabs-cyd.webp
          test -s 'public/pictures/boards/ESP32-2432S028R (2.8in CYD).png'

      - name: Apply BitzyLabs source and device registry overlay
        run: python .bitzylabs-overlay/apply_overlay.py

      - name: Validate generated firmware metadata
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('public/firmware/bitzylabs-cyd/v0.1.0-rc1')
          manifest = json.loads((root / 'manifest.json').read_text())
          factory = root / 'BitzyLabs-CYD_factory.bin'
          update = root / 'BitzyLabs-CYD_firmware.bin'

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          assert factory.stat().st_size > 1_000_000
          assert update.stat().st_size > 1_000_000
          assert manifest['sha256']['BitzyLabs-CYD'] == digest(factory)
          assert manifest['files']['factory']['sha256'] == digest(factory)
          assert manifest['files']['update']['sha256'] == digest(update)
          print('Firmware metadata and hashes verified')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify current upstream plus BitzyLabs overlay builds
        run: |
          npm ci
          npm run build

      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _bitzy_firmware_src

          git add -A
          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE" rev-parse --short=12 bitronics/main)"
          FIRMWARE_SHA="$(git ls-remote https://github.com/${BITZY_FIRMWARE_REPO}.git ${BITZY_FIRMWARE_REF} | awk '{print substr($1,1,12)}')"

          if git diff --cached --quiet; then
            echo 'Candidate already matches current upstream plus BitzyLabs overlay.'
          else
            git commit -m "Build BitzyLabs candidate on Bitronics ${SOURCE_SHA} / firmware ${FIRMWARE_SHA}"
          fi

          # This is a generated, non-production branch. It is deliberately
          # replaced atomically each run; main and the live Pages deployment
          # are never touched by this workflow.
          git push --force origin HEAD:"$CANDIDATE_BRANCH"

name: Sync upstream

# Keeps this fork a faithful copy of BitMaker-hub/bitronics-web-flasher with
# the BitzyLabs branding laid back on top.
#
# The old replica kept drifting and eventually stopped building, so the tree
# was resynced to upstream by hand. This workflow makes that repeatable: it
# merges upstream in (upstream wins wherever both sides edited the same line),
# restores our tooling from the pre-sync commit, re-applies the branding,
# build-checks the result and pushes. The push is a fast-forward because it is
# a merge -- a hard reset would rewrite main and be rejected every night.
#
# Upstream is pulled daily, a little after the firmware bot so the two jobs do
# not collide.

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The sync script builds the site to prove the merge did not break it.
      # Pin the same Node the deploy uses so a runner image bump cannot make
      # the 3am sync fail for reasons that have nothing to do with upstream.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # The script does everything: fetch, merge, restore tooling, re-brand,
      # build-check, commit and push. HEAD before and after is the only honest
      # signal that anything happened -- a quiet night exits without moving it.
      - name: Sync and re-brand
        id: sync
        run: |
          BEFORE=$(git rev-parse HEAD)
          ./scripts/sync-upstream.sh --push
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already in step with upstream; nothing to deploy."
          fi

      # A push made with GITHUB_TOKEN deliberately does not start other
      # workflows, so the deployment that should follow this commit has to be
      # asked for directly. Without this step the sync would land on main and
      # the live site would keep serving whatever was deployed before it.
      - name: Trigger deployment
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy Next.js site to Pages" --ref main
